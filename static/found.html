<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR-Find — найденная вещь</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f3f6ff,#eefaf8);font-family:Manrope,Arial;color:#172033;min-height:100vh;display:grid;place-items:center;padding:22px}.card{background:white;width:min(520px,100%);padding:30px;border-radius:25px;box-shadow:0 20px 70px #24365b18}.brand{font-weight:800;font-size:20px;margin-bottom:25px}.brand span{color:#536dfe}.mark{display:inline-grid;place-items:center;background:linear-gradient(135deg,#536dfe,#27c6c8);color:white;width:38px;height:38px;border-radius:13px;margin-right:8px}.tag{font-size:11px;font-weight:800;letter-spacing:1px;color:#536dfe;background:#eef1ff;padding:8px 12px;border-radius:30px}.photo{width:100%;height:200px;object-fit:cover;border-radius:16px;margin:20px 0 12px}.placeholder{height:100px;background:#f3f6fc;border-radius:16px;margin:20px 0;display:grid;place-items:center;font-size:35px;color:#8b9abb}h1{font-size:29px;letter-spacing:-1px;margin:14px 0 8px}p{color:#738097;line-height:1.6}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px;border:1px solid #e1e7f1;border-radius:12px;font:inherit;outline:none}.field textarea{min-height:95px;resize:vertical}.btn{width:100%;padding:14px;border:0;border-radius:13px;background:#536dfe;color:white;font:700 15px Manrope;cursor:pointer;margin-top:8px}.note{font-size:12px;text-align:center;margin-top:15px;color:#9aa5b8}.success{text-align:center;padding:25px 0}.success b{font-size:44px;color:#20aa82}.error{text-align:center;color:#bd4a4a;padding:30px}
</style></head><body><main class="card"><div class="brand">QR<span>‑Find</span></div><div id="content"><div class="placeholder">⌁</div><p>Загружаем информацию о вещи…</p></div></main><script>
const token=location.pathname.split('/').pop(),root=document.getElementById('content');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{let r=await fetch('/api/public/'+token),x=await r.json();if(!r.ok)throw Error(x.detail||'Вещь не найдена');root.innerHTML=`<span class="tag">ВОЗМОЖНО, ЭТУ ВЕЩЬ ИЩУТ</span>${x.photo?`<img class="photo" src="${x.photo}">`:'<div class="placeholder">⌁</div>'}<h1>${esc(x.title)}</h1><p>${esc(x.description||'Владелец зарегистрировал эту вещь в QR-Find. Если вы её нашли, пожалуйста, сообщите об этом через форму ниже.')}</p>${x.status==='returned'?'<div class="success"><b>✓</b><h2>Вещь уже возвращена</h2></div>':`<h3>Вы нашли эту вещь?</h3><p>Оставьте сообщение владельцу. Ваши контактные данные не публикуются.</p><form id="msgForm" onsubmit="send(event)"><div class="field"><label>Как к вам обращаться *</label><input name="finder_name" required maxlength="80" placeholder="Ваше имя"></div><div class="field"><label>Сообщение владельцу *</label><textarea name="message" required minlength="5" maxlength="1200" placeholder="Расскажите, где находится вещь и как её можно забрать"></textarea></div><div class="field"><label>Где нашли? (необязательно)</label><input name="place" maxlength="180" placeholder="Например, библиотека, аудитория 204"></div><div class="field"><label>Когда нашли? (необязательно)</label><input name="found_time" maxlength="80" placeholder="Сегодня около 14:00"></div><button class="btn">Отправить сообщение владельцу</button></form>`}<div class="note">QR-Find · Безопасная связь без публикации личных контактов</div>`}catch(e){root.innerHTML='<div class="error"><h2>Не удалось открыть карточку</h2><p>'+esc(e.message)+'</p></div>'}}
async function send(e){e.preventDefault();let f=new FormData(e.target),data=Object.fromEntries(f.entries());try{let r=await fetch('/api/public/'+token+'/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),d=await r.json();if(!r.ok)throw Error(d.detail||'Ошибка отправки');root.innerHTML='<div class="success"><b>✓</b><h2>Сообщение отправлено!</h2><p>Владелец получит его в своём личном кабинете QR-Find. Спасибо, что помогаете вернуть вещь.</p></div><div class="note">QR-Find · Спасибо за вашу помощь</div>'}catch(e){alert(e.message)}}
load();
</script></body></html>
